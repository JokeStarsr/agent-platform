<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企业智能客服</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat">
    <header>
      <h1>企业智能客服</h1>
      <span class="sub">RAG · 引用溯源 · 转人工</span>

      <button type="submit">发送</button>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
