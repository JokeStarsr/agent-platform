<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Agent · Agent Platform</title>
  <link rel="stylesheet" href="/common.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    .query-form { display: flex; gap: 10px; margin-bottom: 20px; }
    .query-input { flex: 1; padding: 10px; font-size: 14px; border: 1px solid #d1d5db; border-radius: 6px; }
    .result-section { margin-top: 20px; }
    .chart-container { width: 100%; height: 400px; margin: 20px 0; background: #f9fafb; border-radius: 8px; }
    .data-table { width: 100%; border-collapse: collapse; margin: 15px 0; }
    .data-table th, .data-table td { padding: 8px 12px; border: 1px solid #e5e7eb; text-align: left; }
    .data-table th { background: #f3f4f6; font-weight: 600; }
    .data-table tr:nth-child(even) { background: #f9fafb; }
    .sql-display { background: #f3f4f6; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; }
    .verification-pass { color: #16a34a; font-weight: 600; }
    .verification-fail { color: #dc2626; font-weight: 600; }
    .metadata-box { background: #eff6ff; padding: 12px; border-radius: 6px; border-left: 4px solid #2563eb; margin: 15px 0; font-size: 13px; }
    .export-buttons { display: flex; gap: 10px; margin-top: 15px; }
    .export-btn { padding: 8px 16px; background: #6b7280; color: white; border: none; border-radius: 6px; cursor: pointer; }
    .export-btn:hover { background: #4b5563; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="badge">L4 能力层 · W16</span>
      <h1>📊 Data Agent</h1>
      <div class="sub"><a href="/">← 返回首页</a> ｜ NL2SQL 自然语言查询 + 图表生成 + 数值复算校验 + 数据血缘</div>
    </header>

    <div class="alerts" id="alerts"></div>

    <div class="card">
      <h3>🔍 自然语言查询</h3>
      <form class="query-form" id="queryForm">
        <input type="text" id="question" class="query-input" placeholder="例如：上月销售额最高的 3 个产品" required>
        <button type="submit" class="primary">查询</button>
      </form>
      <div class="row" style="gap:15px;font-size:13px;color:#6b7280">
        <label><input type="checkbox" id="enableVerification" checked> 启用数值复算校验</label>
        <label><input type="checkbox" id="enableChart" checked> 自动生成图表</label>
      </div>
    </div>

    <div id="resultSection" class="result-section" hidden>
      <div class="card">
        <h3>💻 生成的 SQL</h3>
        <div id="sqlDisplay" class="sql-display"></div>
      </div>

      <div class="card">
        <h3>📋 查询结果</h3>
        <div id="resultMeta" class="metadata-box"></div>
        <div id="dataTableContainer"></div>
      </div>

      <div class="card" id="chartCard" hidden>
        <h3>📈 图表</h3>
        <div id="chartInfo" class="metadata-box"></div>
        <div id="chartContainer" class="chart-container"></div>
      </div>

      <div class="card" id="verificationCard" hidden>
        <h3>✅ 数值验证</h3>
        <div id="verificationResult"></div>
      </div>

      <div class="card" id="lineageCard" hidden>
        <h3>🔗 数据血缘</h3>
        <div id="lineageInfo" class="metadata-box"></div>
        <div class="export-buttons">
          <button class="export-btn" id="exportMarkdown">📄 导出 Markdown</button>
          <button class="export-btn" id="exportHtml">🌐 导出 HTML</button>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
