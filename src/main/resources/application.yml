# L5 MCP 网关（W10，docs/design/architecture/20260904-mcp-gateway.md）
# api-keys：租户 → API Key 映射（MCP 入站鉴权）；key 由环境变量注入，dev-key 仅本地兜底
# rate-limit.global-qps：租户级全局限流
agent-platform:
  mcp:
    api-keys:
      default: ${MCP_DEFAULT_API_KEY:dev-key}
    rate-limit:
      global-qps: 50

app:
  rag:
    enabled: true        # ZHIPUAI_API_KEY 已配置，启用 RAG 服务
    handoff:             # L5 转人工门控（P1 收口，docs/design/api/20260830-handoff-mechanism.md）
      threshold: 0.25    # 合成置信度阈值，低于即建议转人工（2026-08-30 三轮校准：TRAP 全改 REFUSAL 信号识别后不再依赖 LOW_CONFIDENCE，0.25 作纯兜底减少 KB 误转人工）
      w-retrieval: 0.55  # 检索相似度权重
      w-coverage: 0.25   # 查询关键词覆盖率权重
      w-citation: 0.20   # 引用完整率权重
  audit:
    enabled: true        # 审计日志切面（P1 收口 #4，docs/design/api/20260830-audit-chatui.md）

server:
  port: 8080

spring:
  application:
    name: agent-platform

  ai:
    # Spring AI 1.0.0 模型选择器：同时存在多模型时必配，否则多个 ChatModel/EmbeddingModel bean 冲突
    model:
      # 模型选择器：不设则智谱三个自动配置（chat/embedding/image）都会 explode，空 key 启动即失败
      chat: openai            # ChatModel 只用 OpenAI（对接 DeepSeek，OpenAI 兼容协议）
      embedding: zhipuai      # EmbeddingModel 用智谱（RAG 向量化）
      image: openai           # 禁用智谱 image（未配 key 时 zhiPuAiImageModel 会拒绝启动）

    # L6 模型服务：本地默认走 sub2api→zen 免费通道；CI/生产用 LLM_BASE_URL/LLM_API_KEY/LLM_MODEL 覆盖（如 DeepSeek 公网 API）
    # 注意：Spring AI 会自动追加 /v1/chat/completions，base-url 不要带 /v1（曾遇 /v1/v1 404）
    # key 一律从环境变量读取，禁止明文入库（2026-08-31 A4 治理，曾有明文兜底提交进 git）
    openai:
      base-url: ${LLM_BASE_URL:http://localhost:8180}
      api-key: ${LLM_API_KEY}
      chat:
        options:
          model: ${LLM_MODEL:claude-sonnet-4-5-20250929}
          max-tokens: 4096
          temperature: 0.7
          stream-usage: true

    # L5 MCP Server 自动配置（W10，docs/design/architecture/20260904-mcp-gateway.md §3.1）
    # SSE 端点必须在 /mcp 前缀下（McpAuthFilter 拦截 /mcp/*）；message 端点默认 /mcp/message 已覆盖
    mcp:
      server:
        name: agent-platform
        version: 1.0.0
        sse-endpoint: /mcp/sse
        sse-message-endpoint: /mcp/message
        request-timeout: 30s

    # 智谱 Embedding（RAG 向量化用）
    zhipuai:
      api-key: ${ZHIPUAI_API_KEY}

    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        dimensions: 1024

  # L7 数据层：PostgreSQL + pgvector（本地开发，docker-compose 一键起）
  datasource:
    url: jdbc:postgresql://localhost:5432/agent_platform
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # 表结构幂等 DDL（每次启动执行）：Agent Runtime（20260831-agent-runtime.md §4）+ Workflow 引擎（20260831-workflow-engine.md §4）
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:schema-agent-runtime.sql
        - classpath:schema-workflow.sql
        - classpath:schema-memory.sql
        - classpath:schema-policy.sql
        - classpath:schema-app.sql
        - classpath:schema-mcp.sql

  # W7 记忆/上下文配置（docs/design/architecture/20260901-memory-context.md §2.3）
  memory:
    short-term-ttl-seconds: 1800      # 短期记忆（Redis）滚动 TTL 30 分钟
    long-term-topk: 5                 # 长期记忆默认近邻召回数
    budget-default-tokens: 16384      # 上下文组装默认总预算token

  # 短期记忆（P2 使用，先起容器避免误连）
  data:
    redis:
      host: localhost
      port: 6379

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{trace_id:-}] %logger{36} - %msg%n"